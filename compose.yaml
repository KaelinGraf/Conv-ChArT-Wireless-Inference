# Raspberry Pi side of the Conv-ChArT wireless inference link (ROS 2 Jazzy, linux/arm64).
#   on the Pi:  docker compose up -d pi && docker compose exec pi bash
# Settings come from .env (copy .env.example). Full docs: docker/README.md
name: convchart-wireless

services:
  # ---------------------------------------------------------------------------
  # Raspberry Pi: streams camera frames to the laptop's inference node and gets
  # poses back over WiFi, runs the fixed-rate Kalman filter, drives the Arduino
  # Mega 2560 over USB serial.
  # ---------------------------------------------------------------------------
  pi:
    build:
      context: ./docker
      dockerfile: pi/Dockerfile
      args:
        WITH_CAMERA: ${WITH_CAMERA:-0}
        ARDUCAM_PICAMERA2_REF: ${ARDUCAM_PICAMERA2_REF:-main}
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: convchart-wireless/pi:jazzy
    platform: linux/arm64     # native on the Pi; cross-built through QEMU on x86
    container_name: convchart-pi
    hostname: convchart-pi
    network_mode: host        # DDS / zenoh discovery with the laptop needs the real LAN interface
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: sleep infinity   # replace with `ros2 launch ...` once the nodes exist
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
    volumes:
      - .:/workspace          # this repo; the shell env sources src/ros/install from here
      - pi-home:/home/dev
    devices:                  # Docker will not start the container if this device is missing
      - ${ARDUINO_PORT:-/dev/ttyACM0}:/dev/ttyACM0
    cap_add:
      - SYS_NICE              # SCHED_FIFO / nice for the fixed-rate filter loop
    ulimits:
      rtprio: 99

  # ---------------------------------------------------------------------------
  # The same container with the camera attached. Run it INSTEAD of `pi`:
  #   docker compose --profile camera up -d pi-camera
  # It is a separate service because compose cannot make `devices` conditional,
  # and a listed-but-absent device stops the container -- the Arduino footgun
  # documented in docker/README.md. This keeps the default `pi` service
  # unprivileged and startable on a board with no camera.
  #
  # Needs WITH_CAMERA=1 at BUILD time and, on the host, config.txt carrying
  #   camera_auto_detect=0
  #   dtoverlay=arducam-pivariety
  # ---------------------------------------------------------------------------
  pi-camera:
    extends:
      service: pi
    profiles: ["camera"]
    container_name: convchart-pi-camera
    # TIER 2, for first bring-up. Get the camera working this way, THEN narrow it:
    # run `ls -l /dev/video* /dev/media* /dev/v4l-subdev* /dev/dma_heap/*` on the
    # actual Pi, read off the real major numbers, and replace `privileged` with the
    # device_cgroup_rules block below. The majors are dynamic, so they cannot be
    # guessed off-board -- debugging device permissions and libcamera at the same
    # time is the thing to avoid.
    privileged: true
    # TIER 1, once those numbers are known. Replace `privileged: true` with:
    #   device_cgroup_rules:
    #     - 'c 81:* rmw'    # video4linux: /dev/video*, /dev/v4l-subdev*
    #     - 'c <media>:* rmw'   # media controller: /dev/media*
    #     - 'c 10:* rmw'    # misc, including /dev/dma_heap/*
    #   group_add: [ video ]
    volumes:
      - .:/workspace
      - pi-home:/home/dev
      # libcamera enumerates cameras through udev. WITHOUT THIS, Picamera2()
      # reports no cameras at all and the error says nothing about udev.
      - /run/udev:/run/udev:ro
      # /dev/video*      rp1-cfe capture and pisp ISP nodes
      # /dev/media*      the media controller libcamera CONFIGURES the pipeline
      #                  through -- missing it is the classic "no cameras
      #                  available" inside Docker
      # /dev/v4l-subdev* the sensor subdevices it sets mode and exposure on
      # /dev/dma_heap    where a Pi 5 allocates frame buffers; missing it fails
      #                  at configure(), not at open
      - /dev/dma_heap:/dev/dma_heap

volumes:
  pi-home:
